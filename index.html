<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pearls · Jigsaw Reading (IELTS style)</title>
<style>
:root{
  --ink:#1D2A3A; --muted:#5E6B78; --paper:#F5F8FB; --card:#FFFFFF; --line:#D6E1EA;
  --A:#1F6FA0; --A-l:#E2EFF7; --B:#B5476B; --B-l:#FBE9EF; --AB:#7A5BB0; --AB-l:#EEE8F7;
  --ok:#1E8A55; --ok-l:#E3F5EA; --bad:#C23B35; --bad-l:#FBE5E3;
  --serif:Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:19px;line-height:1.6;color:var(--ink);background:var(--paper);
  background-image:radial-gradient(rgba(31,111,160,.10) 2px,transparent 2.5px);background-size:34px 34px}
button{font:inherit;cursor:pointer;color:inherit}
header{background:linear-gradient(135deg,#0B2540,#14507A 50%,#3E8DB8 85%,#9CCBE0);color:#fff;padding:20px 22px 0;position:relative;overflow:hidden}
header h1{margin:0;font-family:var(--serif);font-size:30px;font-weight:700}
header h1 .h{color:#F7D6E2}
header p{margin:2px 0 14px;opacity:.9;font-size:17px}
.combs{position:absolute;right:14px;top:6px;font-size:58px;opacity:.25;letter-spacing:-8px}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;max-width:1100px;margin:0 auto}
nav.tabs button{border:0;border-radius:14px 14px 0 0;padding:10px 18px;font-weight:700;background:rgba(255,255,255,.14);color:#fff}
nav.tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink)}
nav.tabs .dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:middle}
main{max-width:1100px;margin:0 auto;padding:22px 18px 30px}
.warn{border-radius:14px;padding:12px 16px;margin-bottom:16px;font-weight:600;display:flex;gap:10px;align-items:flex-start}
.warn.A{background:var(--A-l);border:2px solid var(--A)}
.warn.B{background:var(--B-l);border:2px solid var(--B)}
.ar{direction:rtl;font-family:Tahoma,"Segoe UI",Arial,sans-serif;color:var(--B)}
.grid{display:grid;grid-template-columns:1fr 290px;gap:20px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
article.text{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:24px 28px;-webkit-user-select:text;user-select:text}
article.text.A{border-top:10px solid var(--A)}
article.text.B{border-top:10px solid var(--B)}
article.text h2{font-family:var(--serif);font-size:28px;margin:0 0 4px}
.lab{display:inline-block;font-size:14px;font-weight:800;border-radius:99px;padding:2px 12px;margin-bottom:6px;color:#fff}
.lab.A{background:var(--A)}.lab.B{background:var(--B)}.lab.AB{background:var(--AB)}
#paras p{font-size:20px;line-height:1.8;margin:0 0 16px}
aside.side{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px;position:sticky;top:12px}
aside.side h3{margin:0 0 8px;font-size:19px}
.hlbar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.pen{width:40px;height:40px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 2px rgba(0,0,0,.12)}
.pen[aria-pressed="true"]{border-color:var(--ink)}
.pen.y{background:#FFE58A}.pen.g{background:#BDEBC6}.pen.p{background:#F9C6D8}
.pen.er{background:#fff;font-size:18px}
.hlnote{font-size:14px;color:var(--muted);margin:0 0 6px}
.clearhl{background:none;border:0;text-decoration:underline;font-size:14px;padding:0;margin:0 0 16px;color:var(--muted)}
mark.hl{border-radius:3px;padding:0 1px;color:inherit}
mark.hl.y{background:#FFE58A}mark.hl.g{background:#BDEBC6}mark.hl.p{background:#F9C6D8}
body.erase #paras mark.hl{cursor:pointer;outline:1px dashed var(--bad)}
.words{list-style:none;margin:0 0 16px;padding:0;font-size:16px}
.words li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:5px 0}
.words b{color:var(--ink)}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:700;background:var(--B);color:#fff;box-shadow:0 3px 0 #0B2540}
.btn.amber{background:var(--A);color:#fff;box-shadow:0 3px 0 #0E4568}
.btn.ghost{background:#fff;border:2px solid var(--line);box-shadow:none;color:var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:none}
.full{width:100%}
.team{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px;margin-bottom:18px}
@media(max-width:620px){.team{grid-template-columns:1fr}}
.team h3{grid-column:1/-1;margin:0;font-size:19px}
.team label{display:block;font-weight:700;font-size:15px;margin-bottom:4px}
.team input{width:100%;border:2px solid var(--line);border-radius:10px;padding:9px 12px;font-size:18px;background:#fff}
.team .a input{border-color:var(--A)}.team .b input{border-color:var(--B)}
.sec{background:#fff;border:2px solid var(--line);border-radius:18px;padding:20px 22px}
.sec h2{font-family:var(--serif);margin:0 0 4px;font-size:26px}
.inst{color:var(--muted);margin:0 0 12px}
.q{border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0;background:#fff}
.qh{display:flex;gap:10px;align-items:flex-start}
.num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.qt{font-weight:600;padding-top:3px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
@media(max-width:620px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:10px;align-items:center;text-align:left;border:2px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff}
.opt .lt{font-weight:800;color:var(--B);min-width:18px}
.opt[aria-pressed="true"]{border-color:var(--B);background:var(--B-l)}
.tfrow{display:flex;gap:8px;margin-top:10px}
.tfrow .opt{flex:1;justify-content:center;font-weight:700;max-width:200px}
.short{margin-top:10px;width:100%;max-width:420px;border:2px solid var(--line);border-radius:10px;padding:9px 12px;font-size:18px}
.grp{background:var(--B-l);border-left:6px solid var(--B);border-radius:10px;padding:12px 16px;margin:22px 0 6px}
.grp h3{margin:0 0 4px;font-size:19px}
.grp p{margin:0;font-size:16px}
.mlist{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 16px;margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:16px}
@media(max-width:620px){.mlist{grid-template-columns:1fr 1fr}}
.tfrow .opt{max-width:none}
.mrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.mrow .opt{width:52px;justify-content:center;font-weight:800}
.lim{font-size:13px;color:var(--muted);margin-left:8px}
.fig{margin:6px 0 20px;text-align:center;-webkit-user-select:none;user-select:none}
.fig svg{width:100%;max-width:600px;height:auto;display:block;margin:0 auto}
.fig figcaption{font-size:15px;color:var(--muted);font-style:italic;margin-top:6px}
.summ{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-top:8px;font-size:17px;line-height:1.8}
.gap{color:var(--B);white-space:nowrap}
.flow{margin-top:8px;display:flex;flex-direction:column;align-items:center}
.fstep{background:#fff;border:2px solid var(--A);border-radius:10px;padding:8px 14px;font-size:16px;width:100%;max-width:640px;text-align:center}
.farr{color:var(--A);font-size:14px;line-height:1.4}
.mlist.one{grid-template-columns:1fr}
.opts.one{grid-template-columns:1fr}
.q.right{border-color:var(--ok);background:var(--ok-l)}
.q.wrong{border-color:var(--bad);background:var(--bad-l)}
.q.done .opt,.q.done .short{pointer-events:none}
.opt.correct{border-color:var(--ok)!important;background:#fff!important;box-shadow:0 0 0 2px var(--ok) inset}
.fb{margin-top:10px;font-size:16px}
.src{display:inline-block;font-size:13px;font-weight:800;border-radius:99px;padding:1px 10px;color:#fff;margin-right:6px}
.src.A{background:var(--A)}.src.B{background:var(--B)}.src.AB{background:var(--AB)}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.res{background:#fff;border:2px solid var(--line);border-radius:18px;padding:22px}
.big{font-size:60px;font-weight:900;font-family:var(--serif);line-height:1}
.split{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
@media(max-width:620px){.split{grid-template-columns:1fr}}
.sp{border-radius:14px;padding:14px;text-align:center;font-weight:700}
.sp b{display:block;font-size:30px;font-family:var(--serif)}
.sp.A{background:var(--A-l);border:2px solid var(--A)}.sp.B{background:var(--B-l);border:2px solid var(--B)}.sp.AB{background:var(--AB-l);border:2px solid var(--AB)}
.cert{margin-top:20px;border:10px double var(--B);border-radius:20px;padding:34px 26px;text-align:center;background:linear-gradient(#fff,#F4EEF4);position:relative}
.cert h4{font-family:var(--serif);font-size:36px;margin:4px 0 8px;color:var(--B)}
.cert .nm{font-family:var(--serif);font-size:32px;font-weight:700;margin:10px 0;border-bottom:2px solid var(--B);display:inline-block;padding:0 20px}
.seal{position:absolute;right:22px;top:22px;width:92px;height:92px;border-radius:50%;background:var(--B);color:#fff;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.2;transform:rotate(-10deg);box-shadow:0 0 0 5px #F7D6E2}
@media(max-width:620px){.seal{display:none}}
.empty{color:var(--muted);text-align:center;padding:30px}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,140%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-weight:600;transition:transform .3s;z-index:50;max-width:92vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:40}
footer{text-align:center;color:var(--muted);font-size:15px;padding:10px 0 30px}
@media print{
  header,nav,.noprint,footer,#toast,canvas{display:none!important}
  body{background:#fff}
  .res{border:0;padding:0}
  .cert{break-inside:avoid}
}
</style>
</head>
<body>
<header>
  <div class="combs">🦪 ⚪</div>
  <h1>🦪 Pearls: <span class="h">Treasures of the Gulf</span></h1>
  <p>IELTS-style jigsaw reading for two · <span class="ar" style="color:#F7D6E2">قراءة تعاونية لطالبتين</span></p>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</header>
<main id="app"></main>
<footer>Designed by: Nazila Motahari</footer>
<div id="toast" role="status" aria-live="polite"></div>
<canvas id="cf"></canvas>
<script>
const D={"title": "Pearls: Treasures of the Gulf", "A": {"title": "How a Pearl Is Made", "paras": ["A pearl is the only gem that is made inside a living animal. It begins when an irritant, usually a tiny parasite or a small piece of shell, gets inside an oyster. Many people believe that a grain of sand starts a pearl, but this is mostly a myth, because oysters are very good at pushing sand out.", "To protect itself, the oyster covers the irritant with a smooth, shiny material called nacre. This is the same material that lines the inside of its shell. Each layer of nacre is extremely thin, and a natural pearl is built from thousands of these layers over several years.", "Natural pearls are very rare. Only about one wild oyster in 10,000 contains a pearl, and most of these pearls are not round or not large enough to be valuable. For this reason, a necklace of matching natural pearls was a sign of great wealth for centuries.", "In Japan, a businessman called Kokichi Mikimoto spent years trying to make oysters produce pearls on purpose. After many failures, he finally succeeded in 1893. By placing a small piece of shell inside an oyster, he grew the first cultured pearls, although they were only half-round. Fully round cultured pearls followed in the early 1900s.", "By the 1920s, Japanese pearl farms were producing huge numbers of cultured pearls and selling them for much less than natural pearls. Today, more than 99% of the pearls sold in the world are cultured."], "gloss": [["gem", "حجر كريم"], ["irritant", "جسم مُهيِّج"], ["parasite", "طفيلي"], ["oyster", "محار"], ["myth", "خرافة"], ["layer", "طبقة"], ["rare", "نادر"], ["valuable", "ثمين"], ["wealth", "ثروة"], ["on purpose", "عن قصد"], ["failure", "فشل / محاولة فاشلة"], ["cultured pearl", "لؤلؤ مُستزرَع"]], "bonus": ["Did you know? Nacre is also called \"mother-of-pearl\", and it is often used to decorate boxes and furniture.", "Bonus: Would you prefer a natural pearl or a cultured pearl? Why? Tell your partner."], " ext>\n<text x=\"320\" y=\"217\" text-anchor=\"middle\" font-family=\"Segoe UI,DejaVu Sans,Arial,sans-serif\" font-size=\"12\" fill=\"#5E6B78\">thousands of very thin layers</text>\n<path d=\"M390 125 h40\" stroke=\"#B5476B\" stroke-width=\"3\"/><path d=\"M430 119 l9 6 l-9 6z\" fill=\"#B5476B\"/>\n<defs><radialGradient id=\"pg510120\" cx=\"35%\" cy=\"30%\" r=\"70%\"><stop offset=\"0\" stop-color=\"#FFFFFF\"/><stop offset=\".55\" stop-color=\"#F3E9EE\"/><stop offset=\"1\" stop-color=\"#C9B8C6\"/></radialGradient></defs><circle cx=\"510\" cy=\"120\" r=\"40\" fill=\"url(#pg510120)\" stroke=\"#A895A6\" stroke-width=\"1.5\"/>\n<text x=\"510\" y=\"200\" text-anchor=\"middle\" font-family=\"Segoe UI,DejaVu Sans,Arial,sans-serif\" font-size=\"13.5\" font-weight=\"700\" fill=\"#1D2A3A\">3. a pearl</text>\n<text x=\"510\" y=\"217\" text-anchor=\"middle\" font-family=\"Segoe UI,DejaVu Sans,Arial,sans-serif\" font-size=\"12\" fill=\"#5E6B78\">after several years</text>\n<g transform=\"translate(560 48)\"><rect x=\"-58\" y=\"-16\" width=\"116\" height=\"26\" rx=\"13\" fill=\"#FBE9EF\" stroke=\"#B5476B\" stroke-width=\"1.5\"/><text x=\"0\" y=\"2\" text-anchor=\"middle\" font-family=\"Segoe UI,DejaVu Sans,Arial,sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"#B5476B\">usually NOT sand!</text></g>\n</svg>", "cap": "A pearl is the oyster's way of protecting itself."}, {"after": 2, "svg": "<svg viewBox=\"0 0 640 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Only about one wild oyster in 10,000 contains a natural pearl\">\n<rect width=\"640\" height=\"250\" rx=\"16\" fill=\"#F3F7FA\"/>\n<text x=\"20\" y=\"30\" font-family=\"Segoe UI,DejaVu Sans,Arial,sans-serif\" font-size=\"16\" font-weight=\"800\" fill=\"#1F6FA0\">How rare is a natural pearl?</text>\n<rect x=\"40\" y=\"60\" width=\"22\" height=\"22\" rx=\"5\" fill=\"#C9D6E0\"/><rect x=\"67\" y=\"60\" width=\"22\" height=\"22\" rx=\"5\" fill=\"#C9D6E0\"/><rect x=\"94\" y=\"60\" width=\"22\" height=\"22\ or=\"#F3E9EE\"/><stop offset=\"1\" stop-color=\"#C9B8C6\"/></radialGradient></defs><circle cx=\"51\" cy=\"71\" r=\"6\" fill=\"url(#pg5171)\" stroke=\"#A895A6\" stroke-width=\"1.5\"/>\n<text x=\"40\" y=\"218\" font-family=\"Segoe UI,DejaVu Sans,Arial,sans-serif\" font-size=\"13.5\" fill=\"#1D2A3A\">Each square = <tspan font-weight=\"800\">100 wild oysters</tspan>, so this grid shows 10,000 oysters.</text>\n<text x=\"40\" y=\"238\" font-family=\"Segoe UI,DejaVu Sans,Arial,sans-serif\" font-size=\"13.5\" font-weight=\"800\" fill=\"#B5476B\">Only about ONE of them has a natural pearl, and it may not even be round.</text>\n</svg>", "cap": "Natural pearls are extremely rare."}, {"after": 3, "svg": "<svg viewBox=\"0 0 640 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Natural pearl compared with a cultured pearl, which grows around a small piece of shell placed inside by a person\">\n<rect width=\"640\" height=\"250\" rx=\"16\" fill=\"#F3F7FA\"/>\n<text x=\"20\" y=\"30\" font-family=\"Segoe UI,DejaVu Sans,Arial,sans-serif\" font-size=\"16\" font-weight=\"800\" fill=\"#1F6FA0\">Natural or cultured?</text>\n<g transform=\"translate(160 125)\">\n<circle r=\"58\" fill=\"#F3E9EE\" stroke=\"#C9B8C6\" stroke-width=\"2\"/>\n<circle r=\"8\" fill=\"none\" stroke=\"#DCCDD8\" stroke-width=\"1.5\"/><circle r=\"14\" fill=\"none\" stroke=\"#DCCDD8\" stroke-width=\"1.5\"/><circle r=\"20\" fill=\"none\" stroke=\"#DCCDD8\" stroke-width=\"1.5\"/><circle r=\"26\" fill=\"none\" stroke=\"#DCCDD8\" stroke-width=\"1.5\"/><circle r=\"32\" fill=\"none\" stroke=\"#DCCDD8\" stroke-width=\"1.5\"/><circle r=\"38\" fill=\"none\" stroke=\"#DCCDD8\" stroke-width=\"1.5\"/><circle r=\"44\" fill=\"none\" stroke=\"#DCCDD8\" stroke-width=\"1.5\"/><circle r=\"50\" fill=\"none\" stroke=\"#DCCDD8\" stroke-width=\"1.5\"/><circle r=\"56\" fill=\"none\" stroke=\"#DCCDD8\" stroke-width=\"1.5\"/>\n<circle r=\"3\" fill=\"#5B3A1E\"/>\n</g>\n<text x=\"160\" y=\"208\" text-anchor=\"middle\" font-family=\"Segoe UI,DejaVu Sans,Arial,sans-serif\" font-size=\"14\" font-weight=\"800\" fill=\"#1D2A3A\">NATURAL</text>\n<text x=\"160\" y=\"226\" text-anchor=\"middle\" font-family=\"Segoe UI,DejaVu Sans,Arial,sans-serif\" font-size=\"12\" fill=\"#5E6B78\">starts by accident · nacre all the way through</text>\n<line x1=\"320\" y1=\"50\" x2=\"320\" y2=\"225\" stroke=\"#D3DDE5\" stroke-width=\"2\" stroke-dasharray=\"6 6\"/>\n<g transform=\"translate(470 125)\">\n<circle r=\"58\" fill=\"#F3E9EE\" stroke=\"#C9B8C6\" stroke-width=\"2\"/>\n<circle r=\"40\" fill=\"none\" stroke=\"#DCCDD8\" stroke-width=\"1.5\"/><circle r=\"46\" fill=\"none\" stroke=\"#DCCDD8\" stroke-width=\"1.5\"/><circle r=\"52\" fill=\"none\" stroke=\"#DCCDD8\" stroke-width=\"1.5\"/>\n<circle r=\"36\" fill=\"#E8DCC8\" stroke=\"#B9A47F\" stroke-width=\"2\"/>\n<text y=\"5\" text-anchor=\"middle\" font-family=\"Segoe UI,DejaVu Sans,Arial,sans-serif\" font-size=\"11.5\" font-weight=\"700\" fill=\"#7A6440\">piece of shell</text>\n</g>\n<text x=\"590\" y=\"70\" text-anchor=\"end\" font-family=\"Segoe UI,DejaVu Sans,Arial,sans-serif\" font-size=\"12\" fill=\"#B5476B\" font-weight=\"700\">placed inside by a person</text>\n<text x=\"470\" y=\"208\" text-anchor=\"middle\" font-family=\"Segoe UI,DejaVu Sans,Arial,sans-serif\" font-size=\"14\" font-weight=\"800\" fill=\"#1D2A3A\">CULTURED</text>\n<text x=\"470\" y=\"226\" text-anchor=\"middle\" font-family=\"Segoe UI,DejaVu Sans,Arial,sans-serif\" font-size=\"12\" fill=\"#5E6B78\">Mikimoto, Japan, 1893 · grown on pearl farms</text>\n</svg>", "cap": "A cultured pearl grows around something a person puts inside the oyster."}]}, "B": {"title": "The Pearl Divers of the Gulf", "paras": ["Long before oil, pearls were the main source of wealth for the people of the Gulf. In 2019, archaeologists working on Marawah Island, off the coast of Abu Dhabi, announced that they had found a pearl about 8,000 years old: the oldest natural pearl ever discovered. It is less than one centimetre long and was found on the floor of a room in a Stone Age village.", "The main diving season, called Ghous Al-Kabir (\"the big dive\"), lasted from June to September, so the men were away from home for about four months. It began with a ceremony on the beach called hiraat, when families said goodbye to the crews as they sailed out on wooden dhows.", "Divers used only simple tools. A fettam, a clip made of turtle shell or bone, closed the nose. A stone weight tied to the leg with a rope pulled the diver quickly to the seabed, and a woven bag around his neck held the oysters. Divers held their breath for more than a minute, and a partner on the boat pulled each diver back up with a rope.", "In the late 1920s and early 1930s, the Gulf pearl trade suddenly collapsed. Two problems arrived at the same time. A world economic crisis, the Great Depression, meant that fewer people could buy luxury goods, and cheaper pearls from another country filled the market. A few years later, the discovery of oil gave the region a new future."], "gloss": [["source of wealth", "مصدر الثروة"], ["archaeologist", "عالم آثار"], ["discover", "يكتشف"], ["Stone Age", "العصر الحجري"], ["season", "موسم"], ["ceremony", "احتفال / مراسم"], ["crew", "طاقم"], ["dhow", "مركب خشبي (سفينة شراعية)"], ["seabed", "قاع البحر"], ["hold your breath", "يحبس أنفاسه"], ["collapse", "ينهار"], ["luxury goods", "سلع فاخرة"]], "bonus": ["Did you know? The Abu Dhabi Pearl was first shown to the public at Louvre Abu Dhabi in 2019, in an exhibition called 10,000 Years of Luxury.", "Bonus: Did anyone in your family work in pearling, or do you know a story about it? Tell your partner."], "figs": [{"after": 0, "svg": "<svg viewBox=\"0 0 640 220\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"The Abu Dhabi Pearl: about 8,000 years old, less than one centimetre long, found on Marawah Island\">\n<rect width=\"640\" height=\"220\" rx=\"16\" fill=\"#F3F7FA\"/>\n<text x=\"20\" y=\"30\" font-family=\"Segoe UI,D const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LET="ABCD";const LET5="ABCDE";

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2800)}
const T=[["A","Student A","#8CC8EE"],["B","Student B","#F2A7C0"],["Q","Questions","var(--AB)"],["R","My result","#fff"]];

function tabs(){
  $("#tabs").innerHTML=T.map(([k,l,c])=>`<button role="tab" aria-selected="${S.tab===k}" data-tab="${k}"><span class="dot" style="background:${c}"></span>${l}</button>`).join("");
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{saveHL();S.tab=b.dataset.tab;render();window.scrollTo({top:0})});
}

/* ---------- text tabs ---------- */
function textTab(r){
  const P=D[r],other=r==="A"?"B":"A";
  return `<div class="warn ${r}">⚠️ <div>This is <b>Student ${r}'s</b> text. Student ${other}: please don't read this tab! Your partner will tell you about it.

    <div id="paras">${S.hl[r]||P.paras.map((p,k)=>`<p>${esc(p)}</p>`+(P.figs||[]).filter(f=>f.after===k).map(f=>`<figure class="fig" contenteditable="false">${f.svg}<figcaption>${esc(f.cap)}</figcaption></figure>`).join("")).join("")}</div>
   </article>
   <aside class="side"><h3>🖍️ Highlighter</h3>

    <button class="btn full" id="toQ">Go to the questions →</button>
   </aside>
  </div>`;
}
function bindText(r){
  const box=$("#paras");
  document.body.classList.toggle("erase",S.pen==="er");
  document.querySelectorAll("[data-pen]").forEach(b=>b.onclick=()=>{S.pen=b.dataset.pen;document.querySelectorAll("[data-pen]").forEach(x=>x.setAttribute("aria-pressed",x===b));document.body.classList.toggle("erase",S.pen==="er")});
  $("#clr").onclick=()=>{box.querySelectorAll("mark.hl").forEach(unwrap);saveHL();toast("All highlights cleared")};
  $("#toQ").onclick=()=>{saveHL();S.tab="Q";render();window.scrollTo({top:0})};
  const doHL=()=>{
    if(S.pen==="er")return;
    const sel=getSelection();if(!sel.rangeCount||sel.isCollapsed)return;
    const rg=sel.getRangeAt(0);if(!box.contains(rg.commonAncestorContainer))return;
    if(rg.startContainer.nodeType===3){let o=rg.startOffset;const t=rg.startContainer.nodeValue;while(o>0&&/[A-Za-z0-9'’]/.test(t[o-1]))o--;rg.setStart(rg.startContainer,o)}
    if(rg.endContainer.nodeType===3){let o=rg.endOffset;const t=rg.endContainer.nodeValue;while(o<t.length&&/[A-Za-z0-9'’]/.test(t[o]))o++;rg.setEnd(rg.endContainer,o)}
    const pOf=n=>(n.nodeType===3?n.parentNode:n).closest("p");
    const p1=pOf(rg.startContainer),p2=pOf(rg.endContainer);
    if(!p1||p1!==p2){sel.removeAllRanges();return toast("Please highlight inside one paragraph at a time.")}
    if(!rg.toString().trim()){sel.removeAllRanges();return}
    const m=document.createElement("mark");m.className="hl "+S.pen;
    m.appendChild(rg.extractContents());
    m.querySelectorAll("mark.hl").forEach(unwrap);
    rg.insertNode(m);sel.removeAllRanges();box.normalize();saveHL();
  };
  box.addEventListener("mouseup",()=>setTimeout(doHL,0));
  box.addEventListener("touchend",()=>setTimeout(doHL,300));
  box.addEventListener("click",e=>{const m=e.target.closest("mark.hl");if(S.pen==="er"&&m){unwrap(m);box.normalize();saveHL()}});
}
function unwrap(m){const p=m.parentNode;while(m.firstChild)p.insertBefore(m.firstChild,m);p.removeChild(m)}
function saveHL(){const b=$("#paras");if(b&&(S.tab==="A"||S.tab==="B"))S.hl[S.tab]=b.innerHTML}

     const g=D.groups.find(g=>g.from===i+1);
     const longList=g&&g.list&&g.list.some(x=>x[1].length>28);
     const head=g?`<div class="grp"><h3>${esc(g.title)}</h3><p>${esc(g.inst)}</p>${g.summary?`<div class="summ">${esc(g.summary).replace(/\((\d+)\) ______/g,'<b class="gap">($1) ______</b>')}</div>`:""}${g.flow?`<div class="flow">${g.flow.map(st=>`<div class="fstep">${esc(st).replace(/\((\d+)\) ______/g,'<b class="gap">($1) ______</b>')}</div>`).join('<div class="farr">▼</div>')}</div>`:""}${g.list?`<div class="mlist${longList?" one":""}">${g.list.map(([L,n])=>`<div><b>${L}</b>&nbsp; ${esc(n)}</div>`).join("")}</div>`:""}</div>`:"";
     return head+`<div class="q" id="q${i}"><div class="qh"><span class="num">${i+1}</span><div class="qt">${esc(q.q)}</div></div>${body}<div class="fb"></div></div>`;
   }).join("")}
   <div class="row noprint"><button class="btn" id="ck">✔ Check our answers</button>${S.checked?`<button class="btn ghost" id="again">↺ Try again</button>`:""}</div>
  </section>`;
}
function norm(s){return String(s||"").trim().toLowerCase().replace(/[.!?"]/g,"").replace(/\s+/g," ")}
function right(i){const q=D.Q[i],a=S.ans[i];if(a==null||a==="")return false;
  if(q.type==="tfng"||q.type==="match")return a===q.a; if(q.type==="mc")return +a===q.a;
  if(q.type==="two")return a.split(",").filter(Boolean).sort().join(",")===q.a.slice().sort().join(",");
  if(overLimit(i))return false;
  return q.accept.includes(norm(a))}
function overLimit(i){const q=D.Q[i];return q.type==="short"&&norm(S.ans[i]).split(" ").filter(Boolean).length>q.limit}
function score(){const m={A:[0,0],B:[0,0],"A+B":[0,0]};D.Q.forEach((q,i)=>{m[q.src][1]++;if(right(i))m[q.src][0]++});const tot=D.Q.filter((q,i)=>right(i)).length;return {m,tot,max:D.Q.length}}
function markAll(){
  D.Q.forEach((q,i)=>{const c=$("#q"+i),ok=right(i);c.classList.add("done");c.classList.toggle("right",ok);c.classList.toggle("wrong",!ok);
    if(q.type==="tfng"||q.type==="match")c.querySelector(`[data-v="${q.a}"]`).classList.add("correct");
    if(q.type==="mc")c.querySelector(`[data-v="${q.a}"]`).classList.add("correct");
    if(q.type==="two")q.a.forEach(k=>c.querySelector(`[data-v="${k}"]`).classList.add("correct"));
    const ans=q.type==="two"?q.a.map(k=>LET5[k]).join(" and "):q.type==="mc"?`${LET[q.a]} (${q.options[q.a]})`:q.type==="match"?`${q.a} (${G(i).list.find(x=>x[0]===q.a)[1]})`:q.a;
    const lim=overLimit(i)?" ⚠️ Too many words! In IELTS, an answer over the word limit is marked wrong.":"";
    c.querySelector(".fb").innerHTML=`${srcTag(q.src)}${ok?"✅ <b>Correct!</b> ":`❌ <b>Answer:</b> ${esc(ans)}.${lim} `}${esc(q.why)}`;
  });
}
function bindQ(){
  const nA=$("#nA"),nB=$("#nB");
  nA.oninput=()=>{S.nA=nA.value;const c=$("#cA");if(c)c.textContent=S.nA||"Student A"};
  nB.oninput=()=>{S.nB=nB.value;const c=$("#cB");if(c)c.textContent=S.nB||"Student B"};
  document.querySelectorAll(".opt[data-q]").forEach(b=>b.onclick=()=>{if(S.checked)return;const i=b.dataset.q;
    if(b.classList.contains("two")){let sel=(S.ans[i]||"").split(",").filter(Boolean);const v=b.dataset.v;
      if(sel.includes(v))sel=sel.filter(x=>x!==v);else{if(sel.length>=2){toast("Choose only TWO letters. Tap one to remove it first.");return}sel.push(v)}
      S.ans[i]=sel.join(",");b.setAttribute("aria-pressed",sel.includes(v));return}
    S.ans[i]=b.dataset.v;b.parentNode.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  document.querySelectorAll(".short").forEach(inp=>inp.oninput=()=>{S.ans[inp.dataset.q]=inp.value});
  if(S.checked)markAll();
  $("#ck").onclick=()=>{
    if(S.checked){S.tab="R";render();return}
    if(!S.nA.trim()||!S.nB.trim()){toast("Write both team names at the top first.");(!S.nA.trim()?nA:nB).focus();window.scrollTo({top:0,behavior:"smooth"});return}
    const miss=D.Q.map((q,i)=>(S.ans[i]==null||String(S.ans[i]).trim()===""||(q.type==="two"&&S.ans[i].split(",").filter(Boolean).length<2))?i+1:0).filter(Boolean);
    if(miss.length){toast("Please answer every question. Missing: "+miss.join(", "));return}
    S.checked=true;markAll();
    $("#ck").textContent="See our result →";
    const sc=score();toast(`You scored ${sc.tot} / ${sc.max}! Scroll to see the answers, or open My result.`);
    if(sc.tot>=Math.ceil(sc.max*.8))confetti();
  };
  const ag=$("#again");if(ag)ag.onclick=()=>{S.ans={};S.checked=false;render();toast("Answers cleared. Try again together!")};
}

/* ---------- result ---------- */
function resultTab(){
  if(!S.checked)return `<div class="res empty">Answer the questions with your partner and press <b>Check our answers</b> first. 🦪</div>`;
  const m=score(),pass=m.tot>=Math.ceil(m.max*.8);
  return `<div class="res"><div class="row" style="margin-top:0;align-items:center"><div class="big">${m.tot} / ${m.max}</div>
   <div><b style="font-size:22px">${pass?"Fantastic teamwork! 🦪":"Good effort! 🌊"}</b><br>${pass?"You shared your information well and helped each other.":"You need 16 / 20 for the team certificate. Go back to the Questions tab, look at the answers, then press Try again."}</div></div>
   <div class="split">
    <div class="sp A">Text A questions<b>${m.m.A[0]} / ${m.m.A[1]}</b></div>
    <div class="sp B">Text B questions<b>${m.m.B[0]} / ${m.m.B[1]}</b></div>
    <div class="sp AB">Both texts<b>${m.m["A+B"][0]} / ${m.m["A+B"][1]}</b></div>
   </div>
   <p class="inst">Tip: if one text has a low score, the answers in that text were not explained clearly enough. Read that text together now.</p>
   ${pass?`<div class="noprint">${teamBox()}</div>
   <div class="cert"><div class="seal">TEAM<br>READERS<br>🦪</div><div style="font-size:42px">🦪 🌊 🦪</div><h4>Team Certificate</h4><div>This certifies that</div>
    <div class="nm"><span id="cA">${esc(S.nA)||"Student A"}</span> &amp; <span id="cB">${esc(S.nB)||"Student B"}</span></div>
    <div>worked together as a team to complete the IELTS-style jigsaw reading <i>Pearls: Treasures of the Gulf</i>,<br>sharing information and helping each other, with a score of <b>${m.tot} / ${m.max}</b>.</div>
    <div style="margin-top:8px">${new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"})}</div>
    <div style="margin-top:14px;font-family:var(--serif);font-style:italic">Designed by: Nazila Motahari · Higher Colleges of Technology</div></div>
   <div class="row noprint"><button class="btn amber" id="pr">🖨️ Print / Save as PDF</button></div>`:""}
  </div>`;
}
function bindR(){
  const pr=$("#pr");if(pr)pr.onclick=()=>window.print();
  const nA=$("#nA"),nB=$("#nB");
  if(nA)nA.oninput=()=>{S.nA=nA.value;$("#cA").textContent=S.nA||"Student A"};
  if(nB)nB.oninput=()=>{S.nB=nB.value;$("#cB").textContent=S.nB||"Student B"};
  if(S.checked&&score().tot>=16)confetti();
}

function render(){
  tabs();const A=$("#app");
  if(S.tab==="A"||S.tab==="B"){A.innerHTML=textTab(S.tab);bindText(S.tab)}
  else{document.body.classList.remove("erase");
    if(S.tab==="Q"){A.innerHTML=questionsTab();bindQ()}
    else{A.innerHTML=resultTab();bindR()}}
}
function confetti(){
  const c=$("#cf"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const col=["#1F6FA0","#8CC8EE","#B5476B","#7A5BB0","#F7D6E2"];
  const P=Array.from({length:160},()=>({x:Math.random()*c.width,y:-Math.random()*c.height*.6,r:5+Math.random()*6,c:col[Math.random()*5|0],v:2+Math.random()*3,h:-1.5+Math.random()*3,a:Math.random()*6}));
  let f=0;(function t(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.x+=p.h;p.a+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.5);x.restore()});if(++f<220)requestAnimationFrame(t);else x.clearRect(0,0,c.width,c.height)})();
}
render();
</script>
</body>
